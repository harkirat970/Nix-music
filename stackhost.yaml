version: "1"

user:
  name: "Harkirat"
  github: "harkirat970"

runtime:
  image: "python:3.11-slim" "node:26"
commands:
  build:
    # 1. System packages: FFmpeg, curl, certificates, gnupg
    - "apt-get update && apt-get install -y --no-install-recommends ffmpeg curl ca-certificates gnupg"

    # 2. Node.js 22 LTS setup
    - "mkdir -p /etc/apt/keyrings"
    - "curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg"
    - "echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main' | tee /etc/apt/sources.list.d/nodesource.list"
    - "apt-get update && apt-get install -y --no-install-recommends nodejs"
    - "rm -rf /var/lib/apt/lists/*"

    # 3. Node dependencies (using npm ci per instructions)
    - "npm ci --omit=dev"

    # 4. Python dependencies and verification
    - "python3 -m pip install --upgrade pip"
    - "python3 -m pip install -r requirements.txt"
    - "python3 -m pip check"
    - "python3 start.py --check"

  # Production start without temporary Cloudflare tunnels
  start: "python3 start.py"

repository:
  branch: "main"
  auto_deploy: true
