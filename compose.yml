services:
  app:
    build: .
    env_file: .env
    environment:
      DEMO_MODE: "false"
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - audio-cache:/app/cache
      - ./cookies:/app/cookies:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo-data:
  audio-cache:
